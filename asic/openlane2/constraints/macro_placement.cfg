# ============================================================================
# macro_placement.cfg - Top-level macro (SRAM) placement for npu_shell
#
# Format (OpenLane2):
#   <instance-path> <x-um> <y-um> <orientation>
#
# Orientation: N, S, E, W, FN, FS, FE, FW (LEF/DEF convention).
#
# Coordinates target the DIE_AREA "0 0 3200 2400" set in config.json.
# All 14 macros are tiled in a 4-column x 4-row grid along the bottom of
# the die; the upper portion is left for stdcell logic and top-level PDN
# straps.
#
# Macros (see include/pkg/npu_cfg_pkg.sv for logical sizes):
#   - Weight buffer       :  4 KB  ->  2 * sky130_sram_2kbyte_1rw1r_32x512_8
#   - Activation buffer   :  8 KB  ->  4 * sky130_sram_2kbyte_1rw1r_32x512_8
#   - PSUM buffer         : 16 KB  ->  8 * sky130_sram_2kbyte_1rw1r_32x512_8
#
# Sky130 OpenRAM macro footprint (from the upstream LEF):
#   2 KB 1RW1R 32x512_8  :  683.1 x 416.54 um
#
# Grid pitch: 763 um (x), 497 um (y). 80 um margin to die edges.
#
# Instance paths trace npu_shell -> u_core -> u_mem -> u_router -> buffer
# wrapper -> sky130 generate block "g_sky130.g_bank[i].u_sky130_sram".
# psum_buf goes through an extra u_sram (npu_local_mem_wrap) layer.
# ============================================================================

# Row 0 (y=80) : wt[0..1], act[0..1]
u_core/u_mem/u_router/u_wt_buf/u_sram/g_sky130.g_bank[0].u_sky130_sram            80    80   N

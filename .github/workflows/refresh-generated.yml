name: Refresh Generated Artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh-generated:
    name: Refresh diagrams and generated files
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys sv2v

      - name: Install netlistsvg
        run: npm install -g netlistsvg

      - name: Rebuild generated files and diagrams
        run: |
          make gen
          make viz

      - name: Commit updated generated artifacts
        run: |
          if git diff --quiet -- include/pkg/npu_addrmap_pkg.sv sw/uapi/npu_regs.h docs/diagrams; then
            echo "No generated changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add include/pkg/npu_addrmap_pkg.sv sw/uapi/npu_regs.h docs/diagrams
          git commit -m "ci: refresh generated headers and diagrams"
          git push

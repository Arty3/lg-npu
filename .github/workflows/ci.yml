name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Validate RTL, SW, and generated artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator yosys gcc make git haskell-stack

      - name: Install sv2v
        run: |
          git clone --depth 1 https://github.com/zachjs/sv2v.git /tmp/sv2v
          cd /tmp/sv2v
          stack --no-terminal install --local-bin-path /usr/local/bin
          sv2v --numeric-version

      - name: Install netlistsvg
        run: npm install -g netlistsvg

      - name: Lint RTL
        run: make lint

      - name: Run all RTL simulations
        run: make sim-full

      - name: SW syntax checks
        run: make sw-check

      - name: SW runtime tests
        run: make sw-test

      - name: Regenerate code artifacts
        run: make gen

      - name: Regenerate architecture diagrams
        run: make viz

  asic-sky130:
    name: Sky130 ASIC flow (synth + STA + DRC + LVS)
    runs-on: ubuntu-latest
    needs: validate
    # Long-running job; only run on main and on demand.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OpenLane2 + Volare
        run: make asic-sky130-deps

      - name: Enable Sky130 PDK
        run: |
          make asic-sky130-pdk
          echo "PDK_ROOT=$HOME/.volare" >> "$GITHUB_ENV"

      - name: Stage OpenRAM SRAM macros
        run: make asic-sky130-macros

      - name: Prep design (stage SV for Synlig)
        run: make asic-sky130-prep

      - name: Run OpenLane2 flow
        run: make asic-sky130-ci

      - name: Upload run artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openlane2-runs
          path: asic/openlane2/runs/
          retention-days: 7
